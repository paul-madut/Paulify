<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Paulify test</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #eee;
    font-family: -apple-system, "Slate Pro", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    -webkit-text-size-adjust: none;
  }
  header {
    padding: 10px 12px;
    background: #1c1c1c;
    border-bottom: 1px solid #333;
  }
  h1 { font-size: 17px; margin: 0 0 4px 0; font-weight: 600; }
  #status { font-size: 12px; color: #8f8f8f; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    padding: 14px 12px;
    border-bottom: 1px solid #222;
    font-size: 15px;
  }
  li.active { background: #22303f; }
  li .meta { display: block; font-size: 12px; color: #8f8f8f; margin-top: 3px; }
  #player {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #1c1c1c;
    border-top: 1px solid #333;
    padding: 8px 10px 12px 10px;
  }
  #nowplaying { font-size: 13px; margin-bottom: 6px; color: #ddd; }
  audio { width: 100%; }
  #actions { margin-top: 8px; }
  button {
    font-size: 13px;
    padding: 9px 12px;
    margin-right: 6px;
    background: #2b2b2b;
    color: #eee;
    border: 1px solid #444;
    border-radius: 3px;
  }
  #log {
    font-family: Menlo, monospace;
    font-size: 10px;
    line-height: 1.35;
    color: #9fb3c8;
    padding: 10px 12px 160px 12px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
</style>
</head>
<body>

<header>
  <h1>Paulify</h1>
  <div id="status">loading catalogue</div>
</header>

<ul id="tracks"></ul>

<div id="log"></div>

<div id="player">
  <div id="nowplaying">nothing selected</div>
  <audio id="audio" controls preload="none"></audio>
  <div id="actions">
    <button id="seekmid">seek to 50%</button>
    <button id="clearlog">clear log</button>
  </div>
</div>

<script type="text/javascript">
/* ES5 only. BB10 WebKit has no Promise, no fetch, no arrow functions. */

var API = 'https://0xpuh0b7ri.execute-api.ca-central-1.amazonaws.com';

var audio = document.getElementById('audio');
var statusEl = document.getElementById('status');
var logEl = document.getElementById('log');
var tracksEl = document.getElementById('tracks');
var nowEl = document.getElementById('nowplaying');

function log(message) {
  var stamp = new Date().toTimeString().substring(0, 8);
  logEl.textContent = stamp + '  ' + message + '\n' + logEl.textContent;
}

function setStatus(text) {
  statusEl.textContent = text;
}

function getJSON(url, onSuccess, onError) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    if (xhr.status >= 200 && xhr.status < 300) {
      var parsed;
      try {
        parsed = JSON.parse(xhr.responseText);
      } catch (e) {
        onError('bad JSON: ' + e.message);
        return;
      }
      onSuccess(parsed);
    } else {
      onError('HTTP ' + xhr.status + ' ' + xhr.responseText.substring(0, 120));
    }
  };
  xhr.timeout = 15000;
  xhr.ontimeout = function () { onError('request timed out'); };
  xhr.onerror = function () { onError('network error'); };
  xhr.send();
}

function human(ms) {
  if (!ms && ms !== 0) return '-';
  var total = Math.round(ms / 1000);
  var m = Math.floor(total / 60);
  var s = total % 60;
  return m + ':' + (s < 10 ? '0' + s : s);
}

function renderTracks(tracks) {
  tracksEl.innerHTML = '';
  if (!tracks.length) {
    setStatus('catalogue empty');
    log('catalogue returned 0 tracks');
    return;
  }
  for (var i = 0; i < tracks.length; i++) {
    tracksEl.appendChild(buildRow(tracks[i]));
  }
  setStatus(tracks.length + ' track(s)');
  log('catalogue loaded: ' + tracks.length + ' track(s)');
}

function buildRow(track) {
  var li = document.createElement('li');
  li.setAttribute('data-id', track.id);

  var title = document.createElement('span');
  title.textContent = track.title;

  var meta = document.createElement('span');
  meta.className = 'meta';
  meta.textContent = track.artist + '  ' + human(track.durationMs) + '  ' + track.bitrate + ' kbps';

  li.appendChild(title);
  li.appendChild(meta);

  li.onclick = function () { play(track, li); };
  return li;
}

var activeRow = null;

function play(track, row) {
  if (activeRow) activeRow.className = '';
  row.className = 'active';
  activeRow = row;

  nowEl.textContent = track.title + ' - ' + track.artist;
  setStatus('requesting playback URL');
  log('requesting playback URL for ' + track.id);

  getJSON(API + '/tracks/' + encodeURIComponent(track.id) + '/play', function (body) {
    log('signed URL expires ' + body.expiresAt);
    audio.src = body.url;
    audio.load();
    setStatus('loading audio');
    audio.play();
  }, function (err) {
    log('play request failed: ' + err);
    setStatus('play request failed');
  });
}

audio.addEventListener('loadstart', function () { log('audio: loadstart'); });
audio.addEventListener('loadedmetadata', function () {
  log('audio: loadedmetadata duration=' + audio.duration.toFixed(2) + 's');
  audio.currentTime = 0;
});
audio.addEventListener('canplay', function () {
  log('audio: canplay readyState=' + audio.readyState);
  setStatus('ready - ' + audio.duration.toFixed(1) + 's');
});
audio.addEventListener('playing', function () {
  log('audio: playing');
  setStatus('playing');
});
audio.addEventListener('waiting', function () { log('audio: waiting (buffering)'); });
audio.addEventListener('stalled', function () { log('audio: stalled'); });
audio.addEventListener('seeking', function () {
  log('audio: seeking -> ' + audio.currentTime.toFixed(2) + 's');
});
audio.addEventListener('seeked', function () {
  log('audio: seeked at ' + audio.currentTime.toFixed(2) + 's');
});
audio.addEventListener('timeupdate', function () {
  if (!audio.paused && !audio.seeking) {
    var buffered = 0;
    try {
      if (audio.buffered.length) buffered = audio.buffered.end(audio.buffered.length - 1);
    } catch (e) { buffered = -1; }
    nowEl.textContent = audio.currentTime.toFixed(1) + 's / ' +
      (isNaN(audio.duration) ? '?' : audio.duration.toFixed(1) + 's') +
      '  buffered to ' + buffered.toFixed(1) + 's';
  }
});
audio.addEventListener('ended', function () { log('audio: ended'); setStatus('ended'); });
audio.addEventListener('error', function () {
  var code = audio.error ? audio.error.code : '?';
  var msg = audio.error && audio.error.message ? audio.error.message : '';
  log('audio ERROR code=' + code + ' ' + msg);
  setStatus('playback error ' + code);
});

document.getElementById('seekmid').onclick = function () {
  if (isNaN(audio.duration)) { log('seek ignored: no duration'); return; }
  var target = audio.duration / 2;
  log('seeking to ' + target.toFixed(2) + 's');
  audio.currentTime = target;
};

document.getElementById('clearlog').onclick = function () { logEl.textContent = ''; };

log('navigator.userAgent: ' + navigator.userAgent);
log('API base: ' + API);

getJSON(API + '/tracks', function (body) {
  renderTracks(body.tracks || []);
}, function (err) {
  log('catalogue failed: ' + err);
  setStatus('catalogue failed');
});
</script>

</body>
</html>
